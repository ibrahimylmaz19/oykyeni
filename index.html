
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>.</title>

<style>
#romantikOyun {
  --gold: #d9b77b;
  --wine: #762e3d;
  --bg: #100e10;
  font-family: Arial, sans-serif;
  background: radial-gradient(circle at top, #38212a, #100e10 65%);
  color: #fff;
  min-height: 100vh;
  padding: 25px 15px;
  display: flex;
  justify-content: center;
  align-items: center;
  box-sizing: border-box;
}

#romantikOyun * {
  box-sizing: border-box;
}

#romantikOyun .kart {
  width: 100%;
  max-width: 530px;
  background: rgba(25, 21, 23, .97);
  border: 1px solid #65434c;
  border-radius: 22px;
  padding: 30px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
}

#romantikOyun .ust-yazi {
  color: var(--gold);
  text-align: center;
  font-size: 11px;
  letter-spacing: 4px;
}

#romantikOyun h1 {
  text-align: center;
  font-size: 31px;
  margin: 18px 0 12px;
}

#romantikOyun .aciklama {
  text-align: center;
  color: #c3b7ba;
  font-size: 14px;
  line-height: 1.8;
  margin-bottom: 27px;
}

#romantikOyun .cizgi {
  height: 5px;
  background: #40343a;
  border-radius: 20px;
  overflow: hidden;
  margin-bottom: 13px;
}

#romantikOyun .doluluk {
  height: 100%;
  width: 10%;
  background: linear-gradient(90deg, #9b674b, #e6c78d);
  transition: width .3s;
}

#romantikOyun .sayac {
  color: var(--gold);
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 22px;
}

#romantikOyun .soru {
  font-size: 22px;
  line-height: 1.5;
  min-height: 100px;
  display: flex;
  align-items: center;
  margin-bottom: 20px;
}

#romantikOyun textarea {
  width: 100%;
  height: 145px;
  background: #100e10;
  border: 1px solid #60444d;
  border-radius: 13px;
  padding: 17px;
  color: white;
  font-size: 15px;
  font-family: inherit;
  resize: vertical;
  outline: none;
}

#romantikOyun textarea:focus {
  border-color: var(--gold);
  box-shadow: 0 0 0 2px rgba(217,183,123,.1);
}

#romantikOyun textarea::placeholder {
  color: #82777a;
}

#romantikOyun .ipucu {
  font-size: 11px;
  color: #8e8285;
  margin-top: 10px;
}

#romantikOyun .hata {
  color: #ff9999;
  font-size: 12px;
  margin-top: 10px;
  display: none;
}

#romantikOyun .buton {
  display: block;
  width: 100%;
  border: none;
  border-radius: 11px;
  padding: 16px;
  margin-top: 23px;
  background: linear-gradient(110deg, #a87946, #e5c88e);
  color: #211713;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  transition: .2s;
}

#romantikOyun .buton:hover {
  filter: brightness(1.12);
  transform: translateY(-1px);
}

#romantikOyun .geri {
  background: transparent;
  border: 1px solid #76515b;
  color: var(--gold);
  margin-top: 10px;
}

#romantikOyun .bitis {
  display: none;
  text-align: center;
}

#romantikOyun .kalp {
  font-size: 55px;
  margin: 15px 0;
}

#romantikOyun .bitis h2 {
  color: var(--gold);
  font-size: 26px;
}

#romantikOyun .bitis p {
  color: #c3b7ba;
  line-height: 1.8;
  font-size: 14px;
}

#romantikOyun .son-not {
  color: #a99a9e;
  font-size: 11px;
  margin-top: 15px;
  line-height: 1.6;
}

@media(max-width:500px) {
  #romantikOyun .kart {
    padding: 23px 18px;
  }
  #romantikOyun h1 {
    font-size: 26px;
  }
  #romantikOyun .soru {
    font-size: 20px;
  }
}
</style>
</head>

<body style="margin:0">

<div id="romantikOyun">

  <div class="kart">

    <div id="oyunEkrani">

      <div class="ust-yazi">SADECE İKİMİZ ARASINDA</div>

      <h1>.</h1>

      <div class="aciklama">
        Sana birkaç sorum var...
        Doğru ya da yanlış cevap yok.
        İçinden geldiği gibi, hiç çekinmeden cevapla.
      </div>

      <div class="cizgi">
        <div class="doluluk" id="doluluk"></div>
      </div>

      <div class="sayac" id="sayac">SORU 1 / 10</div>

      <div class="soru" id="soruMetni"></div>

      <textarea
        id="cevapAlani"
        placeholder="Cevabını buraya yaz...">
      </textarea>

      <div class="ipucu">
        Her cevabın benim için değerli. ❤️
      </div>

      <div class="hata" id="hataMesaji">
        Önce bu soruya bir cevap yazmalısın. ❤️
      </div>

      <button class="buton" id="devamButonu" type="button">
        Devam Et →
      </button>

      <button class="buton geri" id="geriButonu" type="button" style="display:none">
        ← Önceki Soru
      </button>

    </div>

    <div class="bitis" id="bitisEkrani">

      <div class="kalp"></div>

      <h2>...</h2>

      <p>
        .
      </p>

      <button class="buton" id="whatsappButonu" type="button">
        WhatsApp'tan Gönder 💌
      </button>

      <div class="son-not">
      
      </div>

    </div>

  </div>
</div>

<script>
(function () {

  const whatsappNumarasi = "905334513893";

  const sorular = [
    "İlk tanıştığımız zamanki düşüncelerinle şimdiki düşüncelerin arasında ne değişti?",
    "Sence birbirimizin hayatına ne katıyoruz?",
    "Benim hangi hareketim yüzünü istemsizce güldürüyor?",
    "Benimle ilgili seni en çok şaşırtan şey ne oldu?",
    "Benden duymayı en çok istediğin cümle ne?",
    "Benim hangi bakışım veya hareketim sende farklı bir his uyandırıyor?",
    "Sence aramızda henüz yaşanmamış ama yaşanmasını istediğin şey ne?",
    "Benimle ilgili arkadaşlarına anlattığın bir şey var mı?",
    "Benim hayatında nasıl bir yerim olsun isterdin?",
    "Şu an bana tek bir soru sorma hakkın olsa ne sorardın?",
    "Son olarak, bana içinden geldiği gibi söylemek istediğin şey ne?"
  ];

  const cevaplar = new Array(sorular.length).fill("");
  let aktifSoru = 0;

  const soruMetni = document.getElementById("soruMetni");
  const cevapAlani = document.getElementById("cevapAlani");
  const sayac = document.getElementById("sayac");
  const doluluk = document.getElementById("doluluk");
  const devamButonu = document.getElementById("devamButonu");
  const geriButonu = document.getElementById("geriButonu");
  const hataMesaji = document.getElementById("hataMesaji");
  const oyunEkrani = document.getElementById("oyunEkrani");
  const bitisEkrani = document.getElementById("bitisEkrani");
  const whatsappButonu = document.getElementById("whatsappButonu");

  function ekraniGuncelle() {
    soruMetni.textContent = sorular[aktifSoru];
    cevapAlani.value = cevaplar[aktifSoru];

    sayac.textContent =
      "SORU " + (aktifSoru + 1) + " / " + sorular.length;

    doluluk.style.width =
      ((aktifSoru + 1) / sorular.length * 100) + "%";

    devamButonu.textContent =
      aktifSoru === sorular.length - 1
        ? "Cevaplarımı Bitirdim ❤️"
        : "Devam Et →";

    geriButonu.style.display =
      aktifSoru === 0 ? "none" : "block";

    hataMesaji.style.display = "none";
  }

  devamButonu.addEventListener("click", function () {

    const cevap = cevapAlani.value.trim();

    if (cevap.length === 0) {
      hataMesaji.style.display = "block";
      cevapAlani.focus();
      return;
    }

    cevaplar[aktifSoru] = cevap;

    if (aktifSoru < sorular.length - 1) {
      aktifSoru++;
      ekraniGuncelle();
    } else {
      oyunEkrani.style.display = "none";
      bitisEkrani.style.display = "block";
    }

  });

  geriButonu.addEventListener("click", function () {

    cevaplar[aktifSoru] = cevapAlani.value.trim();

    if (aktifSoru > 0) {
      aktifSoru--;
      ekraniGuncelle();
    }

  });

  whatsappButonu.addEventListener("click", function () {

    const mesajBolumleri = [
      ".",
      ""
    ];

    for (let i = 0; i < sorular.length; i++) {
      mesajBolumleri.push(
        (i + 1) + ". " + sorular[i],
        cevaplar[i],
        ""
      );
    }

    mesajBolumleri.push("❤️ Cevaplarımı senin için yazdım.");

    const mesaj = encodeURIComponent(mesajBolumleri.join("\n"));

    const whatsappLink =
      "https://wa.me/" + whatsappNumarasi + "?text=" + mesaj;

    window.open(whatsappLink, "_blank");

  });

  ekraniGuncelle();

})();
</script>

</body>
</html>
